<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#08080a">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('kantin_theme')||'dark'}catch(e){}</script>
  <title>Login — Kantin Uimsya Putri</title>
  <style>
    :root{--text:#fff;--text2:rgba(255,255,255,.72);--muted:rgba(255,255,255,.46);--edge:rgba(255,255,255,.16);--input:rgba(14,14,20,.55);--card:linear-gradient(135deg,rgba(255,255,255,.10),rgba(22,22,30,.50) 50%,rgba(12,12,18,.66));--ov:radial-gradient(circle,rgba(0,0,0,.05),rgba(0,0,0,.6))}
    :root[data-theme="light"]{--text:#0f172a;--text2:#475569;--muted:#8392a8;--edge:rgba(255,255,255,.8);--input:rgba(255,255,255,.88);--card:linear-gradient(135deg,rgba(255,255,255,.88),rgba(240,243,250,.74));--ov:radial-gradient(circle,rgba(0,0,0,0),rgba(0,0,0,.45))}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
      background:#08080a url('assets/bg.jpg') no-repeat center center fixed;background-size:cover;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;background:var(--ov);pointer-events:none}
    .orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none}.o1{width:460px;height:460px;top:-90px;left:6%;background:radial-gradient(circle,rgba(99,102,241,.32),transparent 70%)}.o2{width:420px;height:420px;bottom:-40px;right:8%;background:radial-gradient(circle,rgba(255,214,0,.22),transparent 70%)}
    .page{position:relative;width:min(94vw,440px)}
    .card{position:relative;padding:34px 30px 26px;border:1px solid var(--edge);border-radius:26px;background:var(--card);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.35);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7) 25%,rgba(255,214,0,.5) 50%,rgba(255,255,255,.7) 75%,transparent)}
    .cn{position:absolute;width:26px;height:26px;border:1.5px solid rgba(255,214,0,.4);box-shadow:0 0 12px rgba(255,214,0,.4)}.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:26px}.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:26px}
    .logo-wrap{width:92px;height:92px;margin:0 auto 16px;display:grid;place-items:center;border-radius:24px;padding:9px;background:rgba(255,255,255,.1);border:1px solid var(--edge)}.logo{width:100%;height:100%;object-fit:contain;border-radius:16px}.fallback{display:none;font-size:42px}
    .eyebrow{text-align:center;font-size:10.5px;letter-spacing:.2em;font-weight:800;color:#ffd600}
    h1{margin:6px 0 0;text-align:center;font:700 28px 'Space Grotesk','Plus Jakarta Sans',sans-serif;letter-spacing:-.5px}
    .sub{text-align:center;color:var(--text2);margin:8px 0 24px;font-size:13.5px}
    .field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:700;color:var(--text2)}
    .wrap{position:relative}
    input{width:100%;border:1px solid var(--edge);outline:0;border-radius:13px;padding:13px 14px;background:var(--input);color:var(--text);font:inherit;font-size:14.5px;transition:all .2s}
    input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.25)}input::placeholder{color:var(--muted)}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--text2);cursor:pointer;padding:7px}
    button.submit{width:100%;padding:14px;margin-top:6px;border:1px solid rgba(255,255,255,.25);border-radius:13px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font:inherit;font-weight:800;cursor:pointer;font-size:14.5px;box-shadow:0 6px 20px rgba(79,70,229,.45),inset 0 1px 1px rgba(255,255,255,.3);transition:all .2s}
    .submit:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(79,70,229,.55)}.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .msg{display:none;margin-top:13px;padding:11px 12px;border-radius:12px;font-size:13px;background:rgba(244,63,94,.18);color:#fda4af;border:1px solid rgba(244,63,94,.3)}.msg.show{display:block}
    .msg.warn{background:rgba(245,158,11,.18);color:#fde68a;border-color:rgba(245,158,11,.3)}
    :root[data-theme="light"] .msg{color:#be123c}:root[data-theme="light"] .msg.warn{color:#92400e}
    .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.55}
    .theme{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--text);cursor:pointer;font-size:14px}
    .linkish{background:none;border:0;padding:0;color:#a5b4fc;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
    :root[data-theme="light"] .linkish{color:#4f46e5}
    .row-end{display:flex;justify-content:flex-end;margin:-6px 0 12px}
    .msg.ok{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.3)}:root[data-theme="light"] .msg.ok{color:#047857}
    .dev{text-align:center;color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.6}.dev a{color:var(--text2)}
    .hide{display:none!important}
  </style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div>
  <main class="page"><section class="card"><span class="cn tl"></span><span class="cn br"></span>
    <button type="button" class="theme" id="themeBtn" title="Ganti tema">🌓</button>
    <div class="logo-wrap"><img class="logo" src="assets/logo.png" alt="Logo Kantin" onerror="this.style.display='none';document.querySelector('.fallback').style.display='block'"><span class="fallback">🏪</span></div>
    <div class="eyebrow">SISTEM KEUANGAN</div>
    <h1>Kantin Uimsya Putri</h1><div class="sub">Sistem Keuangan & Operasional Kantin</div>
    <div class="msg" id="preMsg"></div>

    <form id="loginForm">
      <div class="field"><label for="username">Email atau username</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nama@email.com" required></div>
      <div class="field"><label for="password">Password</label><div class="wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button type="button" class="toggle" id="toggle">👁</button></div></div>
      <div class="row-end"><button type="button" class="linkish" id="forgotBtn">Lupa password?</button></div>
      <button class="submit" id="loginBtn" type="submit">Masuk</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <form id="recForm" class="hide">
      <div class="field"><label for="newPass">Password baru <span style="font-weight:400">(minimal 8 karakter)</span></label><input id="newPass" type="password" autocomplete="new-password" minlength="8" required placeholder="Password baru"></div>
      <div class="field"><label for="newPass2">Ulangi password baru</label><input id="newPass2" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi password baru"></div>
      <button class="submit" id="recBtn" type="submit">Simpan password baru</button>
      <div class="msg" id="recMsg"></div>
    </form>

    <div class="foot" id="loginFoot">Masuk dengan email atau username Anda. Admin membuat akun pengguna dari dalam aplikasi.</div>
    <div class="dev" id="devLine"></div>
  </section></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="site-config.js"></script>
  <script>
  (()=>{
    const $=id=>document.getElementById(id);
    const form=$('loginForm'),rec=$('recForm'),u=$('username'),p=$('password'),b=$('loginBtn'),m=$('loginMsg'),pre=$('preMsg');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Pesan error dari URL (redirect dari aplikasi)
    const params=new URLSearchParams(location.search);
    const errMap={
      no_access:'⚠️ Akun Anda belum memiliki akses. Hubungi admin untuk mendapatkan akses.',
      deactivated:'🚫 Akun Anda telah dinonaktifkan. Hubungi admin.',
      session_expired:'🔒 Sesi berakhir. Silakan login kembali.',
      session_timeout:'⏱ Sesi login 1 jam telah berakhir. Silakan login kembali.'
    };
    const SESSION_MS=60*60*1000,LOGIN_KEY='kantin_login_at';
    const preErr=params.get('error');
    const say=(el,t,cls)=>{el.textContent=t;el.className='msg show'+(cls?' '+cls:'');};
    if(preErr&&errMap[preErr])say(pre,errMap[preErr],'warn');

    $('themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('kantin_theme',t)}catch(e){}};
    $('toggle').onclick=()=>{const v=p.type==='password';p.type=v?'text':'password';$('toggle').textContent=v?'🙈':'👁';};

    // Footer pengembang (data dari site-config.js)
    (()=>{
      const C=window.KANTIN_SITE||{},P=C.programmer||{};
      const bits=[];
      if(C.dibuat){const d=new Date(C.dibuat+'T00:00:00');if(!isNaN(d))bits.push('Web dibuat '+d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}));}
      if(P.nama)bits.push('Programmer: '+esc(P.nama));
      $('devLine').innerHTML=bits.join(' · ');
    })();

    // Email asli dipakai apa adanya; username lama dipetakan ke email internal
    const toEmail=raw=>{
      const v=String(raw||'').trim().toLowerCase();
      if(v.includes('@'))return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?v:'';
      const clean=v.replace(/[^a-z0-9._-]/g,'');
      return clean?clean+'@kantin-uimsya.local':'';
    };

    const isRecovery=/(^|[#&])type=recovery(&|$)/.test(location.hash.replace(/^#/,'').replace(/^\?/,''));

    if(isRecovery){
      // Tautan reset password dari email: tampilkan form password baru
      form.classList.add('hide');rec.classList.remove('hide');$('loginFoot').classList.add('hide');
      say(pre,'Buat password baru untuk akun Anda.','ok');
      rec.addEventListener('submit',async e=>{
        e.preventDefault();
        const a=$('newPass').value,c=$('newPass2').value,rm=$('recMsg'),rb=$('recBtn');
        if(a.length<8)return say(rm,'Password minimal 8 karakter.');
        if(a!==c)return say(rm,'Konfirmasi password tidak cocok.');
        rb.disabled=true;rb.textContent='Menyimpan...';rm.className='msg';
        try{
          await supabaseClient.auth.getSession(); // pastikan sesi pemulihan dari tautan sudah terbaca
          const {error}=await supabaseClient.auth.updateUser({password:a});
          if(error)throw error;
          await supabaseClient.auth.signOut().catch(()=>{});
          try{localStorage.removeItem(LOGIN_KEY);}catch(e){}
          history.replaceState(null,'',location.pathname);
          rec.classList.add('hide');form.classList.remove('hide');$('loginFoot').classList.remove('hide');
          say(pre,'✅ Password berhasil diubah. Silakan masuk dengan password baru.','ok');
        }catch(err){
          console.error(err);
          say(rm,'Gagal mengubah password: '+(err.message||'tautan mungkin sudah kedaluwarsa. Minta tautan baru.'));
        }finally{rb.disabled=false;rb.textContent='Simpan password baru';}
      });
    }else{
      // Sesi hanya sah dalam 1 jam sejak login; selebihnya dikeluarkan otomatis
      supabaseClient.auth.getSession().then(async({data})=>{
        if(!data.session)return;
        const at=+localStorage.getItem(LOGIN_KEY)||0;
        if(at&&Date.now()-at<SESSION_MS){location.replace('app.html');return;}
        try{localStorage.removeItem(LOGIN_KEY);}catch(e){}
        await supabaseClient.auth.signOut().catch(()=>{});
        if(at&&!preErr)say(pre,errMap.session_timeout,'warn');
      }).catch(()=>{});
    }

    // Lupa password: kirim tautan reset ke email
    let coolUntil=0;
    $('forgotBtn').onclick=async()=>{
      const v=u.value.trim().toLowerCase();
      if(!v.includes('@'))return say(m,'Isi kolom di atas dengan EMAIL Anda, lalu klik "Lupa password?" lagi. (Akun berbasis username: hubungi admin untuk reset.)','warn');
      const email=toEmail(v);if(!email)return say(m,'Format email tidak valid.');
      if(Date.now()<coolUntil)return say(m,'Tunggu sebentar sebelum meminta tautan lagi.','warn');
      coolUntil=Date.now()+60000;
      try{
        const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
        if(error)throw error;
      }catch(err){console.error(err);}
      // Pesan netral: tidak membocorkan apakah email terdaftar
      say(m,'Jika email tersebut terdaftar, tautan untuk membuat password baru telah dikirim. Periksa kotak masuk dan folder spam.','ok');
    };

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const password=p.value;
      if(!u.value.trim()||!password)return say(m,'Email/username dan password wajib diisi.');
      const email=toEmail(u.value);
      if(!email)return say(m,u.value.includes('@')?'Format email tidak valid.':'Email atau username tidak valid.');
      b.disabled=true;b.textContent='Memeriksa...';m.className='msg';
      try{
        const {error}=await supabaseClient.auth.signInWithPassword({email,password});
        if(error)throw error;
        try{localStorage.setItem(LOGIN_KEY,String(Date.now()));}catch(e){}
        location.replace('app.html');
      }catch(err){
        console.error(err);
        const raw=String(err.message||'');
        say(m,/confirm/i.test(raw)?'Email belum dikonfirmasi. Buka email Anda dan klik tautan konfirmasi dari Supabase.':'Login gagal: '+(raw||'Kredensial tidak sesuai.'));
      }finally{
        b.disabled=false;b.textContent='Masuk';
      }
    });
  })();
  </script>
</body>
</html>
